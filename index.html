
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Jahre Fußball SV Baiersbronn</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo-box">
        <img src="logo.png" alt="SV Baiersbronn">
    </div>

    <div class="title-box">
        <h1>100 Jahre Fußball SV Baiersbronn</h1>
        <h2>11 Meter Jubiläumsturnier</h2>
    </div>

    <div class="clock-box">
        <div id="clock">00:00:00</div>
    </div>

</header>

<main class="dashboard">

    <section class="panel">
        <h3>Live-Tabelle</h3>
        <div id="liveTable">
            Daten werden geladen...
        </div>
    </section>

    <section class="panel">
        <h3>Aktuelles Spiel</h3>
        <div id="currentMatch">
            Daten werden geladen...
        </div>
    </section>

    <section class="panel">
        <h3>Letzte Ergebnisse</h3>
        <div id="results">
            Daten werden geladen...
        </div>
    </section>

    <section class="panel">
        <h3>Nächste Spiele</h3>
        <div id="nextMatches">
            Daten werden geladen...
        </div>
    </section>

    <section class="panel fullwidth">
        <h3>KO-Runde</h3>
        <div id="koRound">
            Daten werden geladen...
        </div>
    </section>

</main>

<script src="app.js"></script>

</body>
</html>
